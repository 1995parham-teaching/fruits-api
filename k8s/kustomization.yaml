apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Set your published image here (or override per-cluster), e.g.:
#   kustomize edit set image ghcr.io/OWNER/REPO=ghcr.io/me/fruits-api:v1.0.0
images:
  - name: ghcr.io/OWNER/REPO
    newTag: latest
